[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keitai-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server & agent developer tooling for Fujitsu F-03L and Android Japanese Keitai (Garakei) flip phones"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ha Phu Thinh", email = "haphuthinh@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "keitai",
    "garakei",
    "fujitsu",
    "f03l",
    "android",
    "adb",
    "feature-phone",
    "flip-phone",
    "ai-agent",
    "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "pillow>=10.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
keitai-mcp = "keitai_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["keitai_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
